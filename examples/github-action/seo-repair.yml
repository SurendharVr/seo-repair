# Copy to .github/workflows/seo-repair.yml in the site you want to guard.
# Audits the checked-out site on every pull request and fails the check when a
# critical finding is open. The report and dashboard are attached to the run.
name: SEO audit

on:
  pull_request:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cloned outside the workspace so the audit does not crawl its own source.
      - name: Install seo-repair
        run: |
          git clone --depth 1 --branch v1.0.3 https://github.com/SurendharVr/seo-repair "$RUNNER_TEMP/seo-repair"
          pip install -r "$RUNNER_TEMP/seo-repair/requirements.txt"

      # Point the first argument at the folder that holds your site (. for the repo
      # root). Start with --fail-on critical; tighten to high once the backlog is clear.
      - name: Audit
        run: python "$RUNNER_TEMP/seo-repair/scripts/seo_repair.py" audit . --out seo-repair-out --fail-on critical

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-repair-report
          path: seo-repair-out/
