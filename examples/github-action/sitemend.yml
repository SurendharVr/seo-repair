# Copy to .github/workflows/sitemend.yml in the site you want to guard.
#
# A ratchet: the action builds and audits the pull request and its base branch, and
# fails the check only when the PR adds a measured critical or high finding the base did
# not have. Findings already on the base branch never fail a PR, so you can adopt it on
# a site with a backlog. Judgement calls (two pages that seem to target the same terms)
# are listed as advisory and never fail it. One PR comment quotes each finding's
# evidence and is updated on every push; the full report is attached to the run.
#
# Server-rendered site, or one only a deploy can build? Use preview.yml instead.
name: SEO check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # to post and update the comment

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      # Whatever your build needs. Delete this step for a site that is already HTML.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned, so a new release never changes what fails your build without a PR.
      - uses: SurendharVr/sitemend@v1.7.0
        with:
          # Pick your framework's row from the README's "Build recipes" table. These two
          # lines are Next.js with `output: 'export'` in next.config.js.
          build-command: npm ci && npm run build
          site-dir: out
