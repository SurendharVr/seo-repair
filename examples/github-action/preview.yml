# Copy to .github/workflows/sitemend-preview.yml for a server-rendered site (Next.js
# without a static export, Nuxt, SvelteKit with a server adapter) or any site whose
# preview deploy is the real build.
#
# Vercel and Netlify report each deploy to GitHub as a deployment. When a preview deploy
# succeeds, this crawls it, crawls production, and fails only on what the preview broke.
# The comment goes on the pull request the deployed commit belongs to.
name: SEO check (preview)

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  seo:
    # Only finished preview deploys. Check the environment name your host reports in a
    # deployment's details: Vercel uses "Preview" and "Production".
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: SurendharVr/sitemend@v1.5.1
        with:
          url: ${{ github.event.deployment_status.environment_url }}
          baseline-url: https://www.example.com   # your production site
          # Vercel previews sit behind Deployment Protection by default. Create a
          # "Protection Bypass for Automation" secret in the Vercel project, store it as
          # a GitHub secret, and send it. Delete these lines for public previews.
          http-headers: |
            x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
