name: release

# Publishes to PyPI when a version tag is pushed. One-time setup on pypi.org
# (Publishing -> add a pending publisher): owner SurendharVr, repo seo-repair,
# workflow release.yml, environment pypi. No API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - name: Build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
