[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemend"
# Keep in step with .claude-plugin/plugin.json and SKILL.md; tests/test_skill.py checks it.
version = "1.3.0"
description = "Technical SEO checks for CI: crawls a site folder or live URL, fails the build when a change breaks crawling, indexing, canonicals, links or schema, and never invents a number it did not measure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "surendhar-v" }]
keywords = ["seo", "seo-audit", "technical-seo", "crawler", "sitemap", "structured-data",
            "core-web-vitals", "lighthouse", "claude-code", "claude-skill", "ai-seo", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Environment :: Console",
]
dependencies = ["beautifulsoup4>=4.9", "lxml>=4.6", "requests>=2.25"]

[project.urls]
Homepage = "https://github.com/SurendharVr/sitemend"
Issues = "https://github.com/SurendharVr/sitemend/issues"
Changelog = "https://github.com/SurendharVr/sitemend/blob/main/CHANGELOG.md"

[project.scripts]
sitemend = "sitemend.sitemend:main"

# The skill keeps its flat scripts/ layout (SKILL.md runs them by path). For the wheel,
# that directory is the `sitemend` package and assets/ rides along inside it, so
# `sitemend.py` finds its sibling scripts and the dashboard template exactly where the
# source tree has them.
[tool.setuptools]
packages = ["sitemend", "sitemend.assets"]

[tool.setuptools.package-dir]
sitemend = "scripts"
"sitemend.assets" = "assets"

[tool.setuptools.package-data]
"sitemend.assets" = ["dashboard.html"]
